<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Your study progress at a glance.">
  <title>Dashboard - StudyBuddy</title>
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/theme.js"></script>
</head>
<body data-protected>
  <a class="skip-link" href="#main">Skip to main content</a>
  <header class="site-header" id="site-header"></header>

  <main id="main" tabindex="-1">

    <div class="container">
      <div class="greeting">
        <div>
          <h1 id="page-title">Your dashboard</h1>
          <p id="greeting-sub" class="hint">Loading your progress...</p>
        </div>
        <div class="row">
          <a class="btn" href="focus.html">Start a focus session</a>
          <a class="btn btn-secondary" href="planner.html">Add a task</a>
        </div>
      </div>

      <section aria-labelledby="stats-title">
        <h2 class="visually-hidden" id="stats-title">Summary numbers</h2>
        <dl class="grid grid-4" id="stats"></dl>
      </section>

      <div class="grid grid-2 section">
        <section class="card chart-card" aria-labelledby="completion-title">
          <h2 id="completion-title">Task progress</h2>
          <div id="completion"><p class="loading">Loading...</p></div>
        </section>
        <section class="card chart-card" aria-labelledby="week-title">
          <h2 id="week-title">Focus time this week</h2>
          <div id="week"><p class="loading">Loading...</p></div>
        </section>
      </div>

      <div class="grid grid-2 mt-lg">
        <section class="card" aria-labelledby="upcoming-title">
          <h2 id="upcoming-title">Coming up</h2>
          <div id="upcoming"><p class="loading">Loading...</p></div>
        </section>
        <section class="card" aria-labelledby="subjects-title">
          <h2 id="subjects-title">Progress by subject</h2>
          <div id="subjects"><p class="loading">Loading...</p></div>
        </section>
      </div>
    </div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>
  <script type="module" src="js/dashboard.js"></script>
</body>
</html>
